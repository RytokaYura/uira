name: uira
description: "Uira – Where memories play."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  path_provider: ^2.1.5
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  get_it: ^8.2.0
  logger: ^2.6.1
  equatable: ^2.0.7
  phosphor_flutter: ^2.1.0
  smooth_page_indicator: ^1.2.1
  permission_handler: ^12.0.1
  device_info_plus: ^12.1.0
  meta: ^1.16.0
  go_router: ^16.2.1
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/Ubuntu/
    - assets/images/backgrounds/

  fonts:
    - family: 'Ubuntu'
      fonts:
        - asset: 'assets/fonts/Ubuntu/Ubuntu-Bold.ttf'
          weight: 900
        - asset: 'assets/fonts/Ubuntu/Ubuntu-Medium.ttf'
          weight: 700
        - asset: 'assets/fonts/Ubuntu/Ubuntu-Regular.ttf'
          weight: 600
        - asset: 'assets/fonts/Ubuntu/Ubuntu-Light.ttf'
          weight: 500

        - asset: 'assets/fonts/Ubuntu/Ubuntu-BoldItalic.ttf'
          style: italic
          weight: 900
        - asset: 'assets/fonts/Ubuntu/Ubuntu-MediumItalic.ttf'
          style: italic
          weight: 700
        - asset: 'assets/fonts/Ubuntu/Ubuntu-LightItalic.ttf'
          style: italic
          weight: 500